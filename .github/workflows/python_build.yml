name: Python build

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the uv project and uv.lock
        required: false
        type: string
        default: semana-01/projecto_1/simple_fastapi

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run --with pytest pytest
